services:
  postgres:
    image: postgres:16
    container_name: disneywaits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: disneywaits
      POSTGRES_USER: disney
      POSTGRES_PASSWORD: magic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disney -d disneywaits"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
