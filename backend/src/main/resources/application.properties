spring.application.name=backend

# Database connection — overridable via environment variables (defaults target local Postgres).
# For Azure, set SPRING_DATASOURCE_URL to:
#   jdbc:postgresql://<server>.postgres.database.azure.com:5432/disneywaits?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disneywaits}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:disney}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:magic}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true