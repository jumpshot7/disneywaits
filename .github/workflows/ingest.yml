name: Ingest Wait Times

on:
  workflow_dispatch:
  schedule:
    # Offset off :00/:30 — GitHub's shared scheduler is most congested on round
    # minutes, and scheduled runs are best-effort (delayed or dropped under load).
    - cron: '7,37 * * * *'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run ingestion
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSLMODE: require
        run: python pipeline/main.py
