name: Deploy ingestion function to Azure Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

# id-token: write lets the runner request an OIDC token for azure/login. Without
# it the login step fails before it reaches Azure at all.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sanity check before shipping: the deploy itself cannot tell whether the
      # module actually imports, and a broken import would only surface as a
      # silently failing timer.
      - name: Verify the function module imports
        run: |
          pip install -r functions/requirements.txt
          python -c "import sys; sys.path.insert(0, 'functions'); import function_app; print('function_app imports OK')"

      # Flex Consumption has no Kudu zipDeploy endpoint. A publish profile only
      # carries Kudu credentials, so the deploy action could not see the app's SKU
      # and fell back to zipDeploy, which 404s. Signing in gives it ARM access, so
      # it detects Flex Consumption and uses the one-deploy API instead.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: functions
          remote-build: true
