name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build the static site ourselves so we control the Node version AND can
      # bake the backend URL into the bundle at build time (NEXT_PUBLIC_* vars
      # are embedded during `next build`, not read at runtime).
      - name: Build the static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: https://disneywaits-api-fbcjhyg2dnfnb7ct.northcentralus-01.azurewebsites.net
        run: |
          npm ci
          npm run build

      # Upload the pre-built static files (frontend/out) to Static Web Apps.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "frontend/out"
          skip_app_build: true
          output_location: ""
