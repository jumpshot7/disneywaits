    schedule:
        # Offset off :00 for the same reason as ingest.yml, and staggered so the
        # two workflows don't queue against each other.
        - cron: '11,31,51 * * * *'
jobs:
    curl:
        runs-on: ubuntu-latest
        steps:
            - name: Call Health Endpoint
              run: |
                  curl "https://disneywaits-api-fbcjhyg2dnfnb7ct.northcentralus-01.azurewebsites.net/actuator/health"
        